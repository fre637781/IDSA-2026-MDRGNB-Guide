name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publishable site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          required = ['index.html', 'mobile.css', 'mobile.js', '.nojekyll']
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')

          html = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'doctype': '<!doctype html>' in html.lower(),
              'viewport': 'name="viewport"' in html,
              'mobile css': 'href="mobile.css"' in html,
              'mobile js': 'src="mobile.js"' in html,
              'closing body': '</body>' in html.lower(),
              'closing html': '</html>' in html.lower(),
          }
          failed = [k for k, v in checks.items() if not v]
          if failed:
              raise SystemExit('Site validation failed: ' + ', '.join(failed))

          # Static DOM view for anchor validation; ignore JS template strings inside <script> blocks.
          markup = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I | re.S)

          ids = re.findall(r'\bid=["\']([^"\']+)', markup)
          idset = set(ids)
          seen = set()
          dup = sorted({x for x in ids if x in seen or seen.add(x)})
          if dup:
              raise SystemExit('Duplicate IDs detected: ' + ', '.join(dup[:30]))

          qids = sorted(x for x in idset if re.fullmatch(r'q[1-6]-\d+', x))
          if len(qids) != 41:
              raise SystemExit(f'Expected 41 question anchors, found {len(qids)}')

          hrefs = re.findall(r'<a\b[^>]*\bhref=["\']#([A-Za-z0-9_.:-]+)["\']', markup, flags=re.I)
          broken = sorted({h for h in hrefs if h and not h.startswith('page=') and h not in idset})
          if broken:
              raise SystemExit('Broken static internal anchors: ' + ', '.join(broken[:50]))

          page_ids = set(re.findall(r'data-page=["\']([^"\']+)', markup))
          expected_pages = {'home','bedside','pathogen','drug','syndrome','guidance','reference','qa'}
          missing_pages = sorted(expected_pages - page_ids)
          if missing_pages:
              raise SystemExit('Missing page panes: ' + ', '.join(missing_pages))

          external = sorted(set(re.findall(r'<a\b[^>]*\bhref=["\'](https?://[^"\']+)', markup, flags=re.I)))
          print(f'QA: {len(ids)} IDs; 41/41 question anchors; {len(hrefs)} static internal links; {len(external)} external links.')
          print('Publish validation passed.')
          PY

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure / enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
