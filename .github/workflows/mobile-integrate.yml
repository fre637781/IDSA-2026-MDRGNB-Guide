name: Integrate web assets

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - 'mobile.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/mobile-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject web assets and static metadata into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          old_title = '<title>IDSA 2026 MDRGNB Interactive Bedside Guide — Final Validated Edition · Single Navigation</title>'
          new_title = '<title>IDSA 2026 MDRGNB Interactive Bedside Guide</title>'
          if old_title in s:
              s = s.replace(old_title, new_title, 1)
              changed = True

          head_items = [
              '<meta name="description" content="Interactive bedside guide for the 2026 IDSA guidance on antimicrobial-resistant Gram-negative infections, including ESBL-E, AmpC-E, CRE, DTR P. aeruginosa, CRAB, and S. maltophilia.">',
              '<meta name="theme-color" content="#0d3556">',
              '<link rel="canonical" href="https://fre637781.github.io/IDSA-2026-MDRGNB-Guide/">',
              '<link rel="manifest" href="manifest.webmanifest">',
              '<link rel="stylesheet" href="mobile.css">',
          ]
          for item in head_items:
              if item not in s:
                  if '</head>' not in s:
                      raise SystemExit('Missing </head> in index.html')
                  s = s.replace('</head>', item + '\n</head>', 1)
                  changed = True

          js = '<script src="mobile.js" defer></script>'
          if js not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', js + '\n</body>', 1)
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean public title and integrate web assets'
          git push
