name: Integrate web assets

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - 'mobile.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - '.github/workflows/mobile-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate web assets and polish public-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Stable public title and concise public header.
          s = re.sub(r'<title>IDSA 2026 MDRGNB Interactive Bedside Guide(?:\s*[—·-].*?)?</title>', '<title>IDSA 2026 MDRGNB Interactive Bedside Guide</title>', s, count=1)
          s = re.sub(r'<h1>IDSA 2026 MDRGNB<br>Interactive Bedside Guide.*?</h1>', '<h1>IDSA 2026 MDRGNB<br>Interactive Bedside Guide</h1>', s, count=1, flags=re.S)
          s = re.sub(r'<div class="lead">.*?</div>', '<div class="lead">Bedside navigation for the 2026 IDSA Guidance on antimicrobial-resistant Gram-negative infections, with organism-, drug-, syndrome-, and question-based views.</div>', s, count=1, flags=re.S)

          # Home / bedside copy.
          s = s.replace('<div class="kicker">PAGINATED EDITION</div><h2>選擇閱讀方式</h2><p>已移除舊版頂端 navigation，只保留一條主導覽列。Pathogen / Drug / Syndrome 收進 Explore；41 Questions 內僅保留頁面內 pathogen selector。</p>', '<div class="kicker">BEDSIDE GUIDE</div><h2>選擇閱讀方式</h2>')
          s = s.replace("<div class='homecard' onclick=\"showPage('qa')\"><h3>QA / Nuances</h3><p>Final validation、Critical Nuances、Why Not?。</p></div>", "<div class='homecard' onclick=\"showPage('qa')\"><h3>Clinical Nuances</h3><p>重要 caveats、Rationale nuances 與 Why Not?。</p></div>")
          s = re.sub(r'<section class="panel final-validation" id="final-validation">.*?</section>', '', s, count=1, flags=re.S)
          s = s.replace('<div class="kicker">v9 · ONE-PAGE BEDSIDE RESULT</div>', '<div class="kicker">BEDSIDE RESULT</div>')
          s = s.replace('<div class="notice"><b>使用方式：</b>選擇 organism / resistance group 與 syndrome / mechanism。結果會把 Preferred、Alternative、Not suggested、Dose、Breakpoint/MIC、Critical caveats 與完整 IDSA Suggested approach 集中在同一頁。整理欄位是 navigation aid；最下方 source wording 才是 guideline 原始 recommendation。</div>', '<div class="notice"><b>使用方式：</b>選擇 organism / resistance group 與 syndrome / mechanism，查看 Preferred、Alternative、Not suggested、Dose、Breakpoint/MIC、Critical caveats 與對應的 IDSA Suggested approach。治療決策請以完整 Suggested approach 與 Rationale 為準。</div>')

          # Pathogen / Drug / Syndrome navigation copy.
          s = re.sub(r'<span class="v5tag">.*?</span>', '', s, flags=re.S)
          s = re.sub(r'<div class="v5tag">.*?</div>', '', s, flags=re.S)
          s = s.replace('<div class="notice"><b>安全設計：</b>這個 algorithm 不自行創造 treatment recommendation。它依你選的 clinical situation 導向 guideline 對應 question，最後顯示 <b>完整 Suggested approach 原文</b>。Patient caveats 只提醒你哪些條件不能忽略，不會偷偷改寫 IDSA recommendation。</div>', '<div class="notice"><b>使用方式：</b>依 organism、syndrome / resistance mechanism 與 patient-specific caveats 導向對應 clinical question。請同時閱讀完整 Suggested approach 與 Rationale。</div>')
          s = s.replace('<p>除了從 organism 找 treatment，現在也可以反向從 drug 查：它在哪些情境是 Preferred、Alternative、Not suggested、其 Adult dosing、breakpoint quick view，以及所有相關 clinical questions。</p>', '<p>從 drug 查看其在不同 clinical situations 的 Preferred、Alternative、Not suggested roles，以及 Adult dosing、breakpoint quick view 與相關 clinical questions。</p>')
          s = s.replace('<div class="notice"><b>重要：</b>這一頁只把 guideline 真正有支持的 syndrome pathway 重新排列。若 guideline 沒有 dedicated syndrome recommendation，我不會自行用一般感染症知識補出 treatment algorithm，而會明確標示「沒有 dedicated question」。</div>', '<div class="notice"><b>重要：</b>本頁僅呈現 guideline 有明確支持的 syndrome pathways；若沒有 dedicated syndrome recommendation，會標示「沒有 dedicated question」。</div>')

          # Clinical Nuances: retain clinical caveats, remove audit/build UI.
          s = re.sub(r'<section class="panel qa-panel" id="qa">.*?</section>', '', s, count=1, flags=re.S)
          s = s.replace("data-target='qa' onclick=\"showPage('qa')\">QA / Nuances</button>", "data-target='qa' onclick=\"showPage('qa')\">Clinical Nuances</button>")
          s = s.replace('<div class="kicker">RATIONALE MATTERS</div><h2>Critical Nuances That Change the Bedside Choice</h2>\n<p>這些不是新增 guideline recommendation，而是把原本藏在 Rationale 中、會改變實際選藥順位或適用情境的內容拉到前面。</p>', '<div class="kicker">CLINICAL NUANCES</div><h2>Critical Nuances That Change the Bedside Choice</h2>')

          # Public terminology: remove legacy build labels while preserving all recommendation text.
          s = s.replace('SUGGESTED APPROACH — ORIGINAL WORDING PRESERVED', 'SUGGESTED APPROACH')
          s = s.replace('source-faithful novel/major antibiotic matrix', 'Novel / Major Antibiotic Recommendation Matrix')
          s = s.replace('Source-faithful novel/major antibiotic matrix', 'Novel / Major Antibiotic Recommendation Matrix')

          # Remove obsolete CSS that only supported internal QA/version badges.
          s = re.sub(r'\.qa-stats\{.*?\}\s*\.qa-stats>div\{.*?\}\s*\.qa-stats strong\{.*?\}\s*\.qa-stats span\{.*?\}\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'\.v5tag\{.*?\}\s*', '', s, count=1, flags=re.S)
          s = s.replace('@media(max-width:900px){.qa-stats,.nuance-grid{grid-template-columns:1fr}}', '@media(max-width:900px){.nuance-grid{grid-template-columns:1fr}}')

          head_items = [
              '<meta name="description" content="Interactive bedside guide for the 2026 IDSA guidance on antimicrobial-resistant Gram-negative infections, including ESBL-E, AmpC-E, CRE, DTR P. aeruginosa, CRAB, and S. maltophilia.">',
              '<meta name="theme-color" content="#0d3556">',
              '<link rel="canonical" href="https://fre637781.github.io/IDSA-2026-MDRGNB-Guide/">',
              '<link rel="manifest" href="manifest.webmanifest">',
              '<link rel="stylesheet" href="mobile.css">',
          ]
          for item in head_items:
              if item not in s:
                  if '</head>' not in s:
                      raise SystemExit('Missing </head> in index.html')
                  s = s.replace('</head>', item + '\n</head>', 1)

          js = '<script src="mobile.js" defer></script>'
          if js not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', js + '\n</body>', 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already integrated and polished'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish public guide copy'
          git push
