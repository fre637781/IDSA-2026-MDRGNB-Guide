name: Integrate mobile assets

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - 'mobile.js'
      - '.github/workflows/mobile-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile assets into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="mobile.css">'
          js = '<script src="mobile.js" defer></script>'
          changed = False
          if css not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head> in index.html')
              s = s.replace('</head>', css + '\n</head>', 1)
              changed = True
          if js not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body> in index.html')
              s = s.replace('</body>', js + '\n</body>', 1)
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate mobile responsive assets into index'
          git push
